services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aletheia}
      POSTGRES_USER: ${POSTGRES_USER:-aletheia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aletheia}
    ports:
      - "5432:5432"
    volumes:
      - aletheia_db_data:/var/lib/postgresql/data

volumes:
  aletheia_db_data:
